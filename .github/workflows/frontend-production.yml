name: Frontend Production - Quality Gatekeeper

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: frontend-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gatekeeper:
    name: 🛡️ Lint, Typecheck & Tests (Production Gatekeeper)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run ESLint Verification
        run: npm run lint

      - name: Run Unit Tests (Vitest)
        run: npm run test

      # npm run build ya ejecuta tsc -b (typecheck) antes de vite build
      - name: Typecheck & Build Production Bundle (Vite)
        run: npm run build

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium

      # Los proyectos E2E solo usan Chromium (Desktop Chrome y Pixel 7)
      - name: Install Playwright Chromium with dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies (browsers cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-production
          path: playwright-report/
          retention-days: 14

  deploy:
    name: 🚀 Deploy to Vercel Production
    needs: gatekeeper
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify Vercel secrets are configured
        run: |
          for var in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing repository secret $var"
              exit 1
            fi
          done

      - name: Install Vercel CLI
        run: npm install --global vercel@64.5.0

      - name: Pull Vercel Environment (production)
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build Project Artifacts
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy Prebuilt Artifacts to Vercel Production
        run: |
          url=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          echo "### 🚀 Frontend Producción Desplegado a Vercel!" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** $url" >> $GITHUB_STEP_SUMMARY

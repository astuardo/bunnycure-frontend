name: Frontend CI - Lint & Build

on:
  # main queda cubierto por Frontend Production (gatekeeper), que corre lo mismo antes del deploy
  push:
    branches:
      - staging
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - staging

jobs:
  lint-and-build:
    name: Lint, Typecheck & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run ESLint Verification
        run: npm run lint

      - name: Run Unit Tests (Vitest)
        run: npm run test

      - name: TypeScript Typecheck & Production Build
        run: npm run build

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium

      # Los proyectos E2E solo usan Chromium (Desktop Chrome y Pixel 7)
      - name: Install Playwright Chromium with dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies (browsers cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-ci
          path: playwright-report/
          retention-days: 14

      - name: Validate Docker Nginx Image Build
        run: docker build -t bunnycure-frontend:${{ github.sha }} .

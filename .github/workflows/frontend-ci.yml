name: Frontend CI - Lint & Build

on:
  push:
    branches:
      - main
      - staging
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - staging

jobs:
  lint-and-build:
    name: Lint, Typecheck & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run ESLint Verification
        run: npm run lint

      - name: Run Unit Tests (Vitest)
        run: npm run test

      - name: TypeScript Typecheck & Production Build
        run: npm run build

      - name: Install Playwright Browsers with dependencies
        run: npx playwright install --with-deps

      - name: Run Playwright E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-ci
          path: playwright-report/
          retention-days: 14

      - name: Validate Docker Nginx Image Build
        run: docker build -t bunnycure-frontend:${{ github.sha }} .

# Configuración de Nginx para BunnyCure Frontend PWA
# Diseñada para producción con soporte SPA, Proxy API y caché optimizado PWA

server {
    listen 80;
    server_name app.bunnycure.cl _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/json application/xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Headers de Seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Service Worker y Manifiesto PWA (Siempre validar cambios)
    location ~* (pwa-sw\.js|workbox-.*\.js|manifest\.webmanifest|index\.html)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Assets estáticos versionados por Vite (Inmutables con hash)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Imágenes, fuentes e iconos públicos
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        expires 6M;
        add_header Cache-Control "public, max-age=15552000";
        access_log off;
    }

    # Redirección de rutas legacy del monolito hacia la PWA
    location /legacy-admin {
        return 301 /dashboard;
    }

    location /web/ {
        return 301 /;
    }

    # Enrutamiento SPA (React Router fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy opcional para API Backend (si Nginx actúa como API Gateway único)
    # location /api/ {
    #     proxy_pass https://api.bunnycure.cl/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
